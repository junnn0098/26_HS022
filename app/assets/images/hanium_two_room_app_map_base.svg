      <g>
        <rect x="34" y="42" width="132" height="92" rx="13" fill="#F9FBFF" stroke="#8FA0B4" stroke-width="2"/>
        <rect x="43" y="52" width="58" height="34" rx="8" fill="#EEF5FF" stroke="#AAB8CA" stroke-width="1.5"/>
        <rect x="108" y="52" width="46" height="34" rx="8" fill="#EEF5FF" stroke="#AAB8CA" stroke-width="1.5"/>
