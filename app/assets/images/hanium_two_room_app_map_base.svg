    <rect x="220" y="0" width="220" height="220" fill="url(#woodGrid)" opacity=".75"/>
    <rect x="0" y="440" width="264" height="352" fill="url(#tileGrid)" opacity=".40"/>
    <rect x="293" y="220" width="147" height="220" fill="url(#tileGrid)" opacity=".48"/>
    <rect x="264" y="616" width="176" height="176" fill="url(#tileGrid)" opacity=".32"/>

