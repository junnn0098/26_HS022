      <path d="M199 244A58 58 0 0 1 247 190" class="thin"/>
      <rect x="268" y="404" width="62" height="62" fill="#FFFFFF"/>
      <path d="M268 466A62 62 0 0 1 330 406" class="thin"/>
      <rect x="326" y="404" width="64" height="62" fill="#FFFFFF"/>
