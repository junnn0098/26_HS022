    <path d="M220 0V220" class="inner"/>
    <path d="M0 220H440" class="inner"/>
    <path d="M293 220V440" class="inner"/>
    <path d="M0 440H440" class="inner"/>
    <path d="M264 440V792" class="inner"/>
    <path d="M264 616H440" class="inner"/>

