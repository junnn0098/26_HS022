    <!-- room fills: 10 x 18 tile structure, app scale 44px -->
    <rect x="0" y="0" width="440" height="792" rx="7" fill="#F9FBFF"/>
    <rect x="0" y="0" width="220" height="220" fill="#EFE4D2"/>
    <rect x="220" y="0" width="220" height="220" fill="#FFF0C7"/>
    <rect x="0" y="220" width="293" height="220" fill="#E7F4EF"/>
    <rect x="293" y="220" width="147" height="220" fill="#DDF2F7"/>
    <rect x="0" y="440" width="264" height="352" fill="#DDEBFF"/>
    <rect x="264" y="440" width="176" height="176" fill="#F0F5FF"/>
    <rect x="264" y="616" width="176" height="176" fill="#EAD6F1"/>

    <!-- texture overlays -->
