<svg xmlns="http://www.w3.org/2000/svg" width="768" height="980" viewBox="0 0 768 980">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#15213B" flood-opacity="0.12"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#15213B" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <linearGradient id="wallStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#283242"/>
      <stop offset="1" stop-color="#1D2635"/>
    </linearGradient>
    <pattern id="woodGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 36H36M36 0V36" fill="none" stroke="#CBBFA8" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <pattern id="tileGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 32H32M32 0V32" fill="none" stroke="#A9BED1" stroke-opacity="0.26" stroke-width="1"/>
    </pattern>
    <style>
      text{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif}
      .label{fill:#162033;font-size:22px;font-weight:900}
      .small{fill:#64748B;font-size:14px;font-weight:800}
      .room{fill:#172033;font-size:21px;font-weight:900}
      .wall{fill:none;stroke:url(#wallStroke);stroke-width:8;stroke-linejoin:round;stroke-linecap:square}
      .inner{fill:none;stroke:#263142;stroke-width:6;stroke-linejoin:round;stroke-linecap:square}
      .thin{fill:none;stroke:#8C9AAD;stroke-width:2;stroke-linejoin:round}
      .furn{stroke:#A5B0BF;stroke-width:2;fill-opacity:.96}
    </style>
  </defs>

  <rect width="768" height="980" rx="52" fill="#F3F6FB"/>
  <rect x="42" y="44" width="684" height="892" rx="48" fill="url(#cardBg)" filter="url(#softShadow)"/>
  <rect x="62" y="64" width="644" height="852" rx="40" fill="#FFFFFF" stroke="#E5ECF5" stroke-width="2"/>

  <g transform="translate(137 86)">
