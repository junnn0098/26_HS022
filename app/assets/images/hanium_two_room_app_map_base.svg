        <path d="M320 752q16 -11 32 0M367 752q16 -11 32 0" stroke="#8FA0B4" stroke-width="2" fill="none"/>
        <rect x="390" y="755" width="39" height="35" rx="4" fill="#F9FBFF" stroke="#8FA0B4" stroke-width="2"/>
