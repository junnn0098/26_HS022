    <!-- actual router position -->
    <g transform="translate(292 700)" filter="url(#smallShadow)">
      <rect x="-14" y="-14" width="112" height="42" rx="21" fill="#FFFFFF" stroke="#E6ECF5" stroke-width="2"/>
      <circle cx="7" cy="7" r="14" fill="#EEF6FF"/>
      <path d="M0 8C5 2 10 2 15 8M3 12C7 8 10 8 13 12" fill="none" stroke="#5B6BFF" stroke-width="2" stroke-linecap="round"/>
