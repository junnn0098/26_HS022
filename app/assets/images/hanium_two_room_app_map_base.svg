      <g>
        <rect x="38" y="548" width="174" height="152" rx="15" fill="#F9FBFF" stroke="#8FA0B4" stroke-width="2"/>
        <rect x="50" y="560" width="62" height="44" rx="9" fill="#EEF5FF" stroke="#AAB8CA" stroke-width="1.5"/>
