      <circle cx="0" cy="0" r="11" fill="#2EC48D"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      <circle cx="440" cy="0" r="22" fill="#D8F8EA"/>
      <circle cx="440" cy="0" r="11" fill="#2EC48D"/>
      <circle cx="440" cy="0" r="5" fill="#FFFFFF"/>
      <circle cx="0" cy="792" r="22" fill="#D8F8EA"/>
      <circle cx="0" cy="792" r="11" fill="#2EC48D"/>
      <circle cx="0" cy="792" r="5" fill="#FFFFFF"/>
