<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1700" viewBox="0 0 1080 1700">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#EEF4FC"/>
    </linearGradient>
    <linearGradient id="living" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F6EF"/>
      <stop offset="100%" stop-color="#D8EEE3"/>
    </linearGradient>
    <linearGradient id="kitchen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4CB"/>
      <stop offset="100%" stop-color="#F4D88E"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F1FF"/>
      <stop offset="100%" stop-color="#D2E2FA"/>
    </linearGradient>
    <linearGradient id="bath" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3F8FB"/>
      <stop offset="100%" stop-color="#CAEAF0"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1DFF7"/>
      <stop offset="100%" stop-color="#E2C8ED"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE7EC"/>
      <stop offset="100%" stop-color="#FFD1DA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#17213B" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17213B" flood-opacity="0.14"/>
    </filter>
    <filter id="pathGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="tileGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#8EA0B8" stroke-width="1.3" opacity="0.22"/>
    </pattern>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .title { font-size: 38px; font-weight: 950; fill: #111827; letter-spacing: -1.1px; }
      .sub { font-size: 20px; font-weight: 800; fill: #718096; letter-spacing: -0.2px; }
      .room { font-size: 24px; font-weight: 950; fill: #172033; letter-spacing: -0.5px; }
      .meter { font-size: 20px; font-weight: 950; fill: #334155; }
      .chip { font-size: 18px; font-weight: 950; fill: #10B981; }
      .small { font-size: 15px; font-weight: 850; fill: #64748B; }
      .tiny { font-size: 13px; font-weight: 850; fill: #64748B; }
      .wall { stroke: #243244; stroke-width: 8; stroke-linecap: square; fill: none; }
      .thinWall { stroke: #243244; stroke-width: 6; stroke-linecap: square; fill: none; }
      .door { stroke: #5B677A; stroke-width: 4; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1080" height="1700" rx="70" fill="url(#pageBg)"/>

  <g filter="url(#cardShadow)">
    <rect x="74" y="62" width="932" height="1576" rx="58" fill="#FFFFFF"/>
    <rect x="74" y="62" width="932" height="1576" rx="58" fill="none" stroke="#E3EBF5" stroke-width="3"/>
  </g>

  <text x="120" y="128" class="title">실제 실험 환경 기반 가상 주거 도면</text>
  <text x="120" y="166" class="sub">10 × 18 블럭 · 1블럭 45cm · 전체 4.5m × 8.1m · 총 180개 타일</text>

  <g transform="translate(240 270)">
    <!-- dimension arrows -->
    <line x1="0" y1="-52" x2="600" y2="-52" stroke="#94A3B8" stroke-width="3"/>
    <path d="M0 -52l18 -10v20z" fill="#94A3B8"/>
    <path d="M600 -52l-18 -10v20z" fill="#94A3B8"/>
    <text x="245" y="-67" class="meter">4.5m / 10칸</text>

    <line x1="-58" y1="0" x2="-58" y2="1080" stroke="#94A3B8" stroke-width="3"/>
    <path d="M-58 0l-10 18h20z" fill="#94A3B8"/>
    <path d="M-58 1080l-10 -18h20z" fill="#94A3B8"/>
    <text x="-110" y="560" class="meter" transform="rotate(-90 -110 560)">8.1m / 18칸</text>

    <!-- house shell -->
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="600" height="1080" rx="24" fill="#FFFFFF"/>
      <rect x="0" y="0" width="600" height="1080" rx="24" fill="url(#tileGrid)"/>

      <!-- rooms in exact 10x18 tile grid, each tile = 60px -->
      <rect x="0" y="0" width="360" height="540" fill="url(#living)"/>
      <rect x="360" y="0" width="240" height="360" fill="url(#kitchen)"/>
      <rect x="0" y="540" width="300" height="540" fill="url(#bed)"/>
      <rect x="300" y="540" width="150" height="300" fill="url(#bath)"/>
      <rect x="450" y="360" width="150" height="720" fill="url(#hall)"/>
      <rect x="300" y="840" width="150" height="240" fill="url(#danger)"/>

      <!-- walls -->
      <rect x="0" y="0" width="600" height="1080" rx="22" fill="none" stroke="#243244" stroke-width="10"/>
      <line x1="360" y1="0" x2="360" y2="540" class="thinWall"/>
      <line x1="360" y1="360" x2="600" y2="360" class="thinWall"/>
      <line x1="0" y1="540" x2="450" y2="540" class="thinWall"/>
      <line x1="300" y1="540" x2="300" y2="1080" class="thinWall"/>
      <line x1="450" y1="360" x2="450" y2="1080" class="thinWall"/>
      <line x1="300" y1="840" x2="450" y2="840" class="thinWall"/>

      <!-- openings / door gaps overlays -->
      <rect x="334" y="420" width="52" height="76" fill="url(#living)"/>
      <path d="M334 496 A72 72 0 0 1 386 424" class="door"/>
      <rect x="421" y="622" width="58" height="88" fill="url(#bath)"/>
      <path d="M421 710 A82 82 0 0 1 478 630" class="door"/>
      <rect x="424" y="930" width="55" height="88" fill="url(#danger)"/>
      <path d="M424 1018 A82 82 0 0 1 478 938" class="door"/>

      <!-- furniture living -->
      <rect x="58" y="78" width="142" height="64" rx="20" fill="#AFC4B8" opacity="0.95"/>
      <rect x="78" y="244" width="158" height="96" rx="22" fill="#D7BF77" opacity="0.95"/>
      <circle cx="122" cy="292" r="22" fill="#FFF8D8"/>
      <circle cx="180" cy="292" r="22" fill="#FFF8D8"/>
      <rect x="244" y="112" width="70" height="222" rx="22" fill="#AFC4B8" opacity="0.48"/>

      <!-- kitchen -->
      <rect x="410" y="58" width="122" height="106" rx="18" fill="#CDB777" opacity="0.92"/>
      <rect x="416" y="224" width="164" height="70" rx="18" fill="#CDB777" opacity="0.92"/>
      <circle cx="462" cy="259" r="19" fill="#FFF8D8"/>
      <circle cx="524" cy="259" r="19" fill="#FFF8D8"/>

      <!-- bedroom -->
      <rect x="58" y="656" width="190" height="180" rx="22" fill="#AFC4E7" opacity="0.95"/>
      <line x1="86" y1="744" x2="222" y2="744" stroke="#F8FBFF" stroke-width="6" opacity="0.95"/>
      <rect x="234" y="612" width="38" height="220" rx="16" fill="#C3B59C" opacity="0.9"/>

      <!-- bathroom -->
      <rect x="346" y="626" width="62" height="168" rx="22" fill="#95CDD7" opacity="0.95"/>
      <circle cx="377" cy="706" r="23" fill="#F8FBFF" opacity="0.98"/>

      <!-- entrance/hall and fall test area -->
      <rect x="498" y="466" width="66" height="178" rx="20" fill="#B78BC8" opacity="0.78"/>
      <rect x="340" y="910" width="72" height="116" rx="20" fill="#FF9BAA" opacity="0.45"/>
    </g>

    <!-- room labels -->
    <text x="28" y="42" class="room">거실 / 보행 실험</text>
    <text x="388" y="42" class="room">주방</text>
    <text x="28" y="586" class="room">침실</text>
    <text x="324" y="586" class="room">욕실</text>
    <text x="484" y="406" class="room">현관</text>
    <text x="322" y="886" class="room">낙상 실험 구역</text>

    <!-- ESP nodes at four corners -->
    <g filter="url(#softShadow)">
      <g transform="translate(0 0)">
        <circle r="34" fill="#D1FAE5"/>
        <circle r="21" fill="url(#green)"/>
        <circle r="9" fill="#FFFFFF"/>
        <text x="-58" y="-22" class="tiny">ESP1</text>
      </g>
      <g transform="translate(600 0)">
        <circle r="34" fill="#D1FAE5"/>
        <circle r="21" fill="url(#green)"/>
        <circle r="9" fill="#FFFFFF"/>
        <text x="22" y="-22" class="tiny">ESP2</text>
      </g>
      <g transform="translate(0 1080)">
        <circle r="34" fill="#D1FAE5"/>
        <circle r="21" fill="url(#green)"/>
        <circle r="9" fill="#FFFFFF"/>
        <text x="-58" y="42" class="tiny">ESP3</text>
      </g>
      <g transform="translate(600 1080)">
        <circle r="34" fill="#D1FAE5"/>
        <circle r="21" fill="url(#green)"/>
        <circle r="9" fill="#FFFFFF"/>
        <text x="22" y="42" class="tiny">ESP4</text>
      </g>
    </g>

    <!-- AP / Jetson -->
    <g filter="url(#softShadow)">
      <rect x="378" y="132" width="172" height="64" rx="24" fill="#FFFFFF"/>
      <circle cx="410" cy="164" r="18" fill="#EEF2FF"/>
      <path d="M401 169l17-17 18 17" fill="none" stroke="#5966F3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="438" y="157" class="tiny">ipTIME AP</text>
      <text x="438" y="178" class="tiny">WiFi 송신</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="444" y="252" width="162" height="64" rx="24" fill="#FFFFFF"/>
      <rect x="468" y="270" width="38" height="32" rx="9" fill="#111827"/>
      <rect x="475" y="278" width="24" height="7" rx="4" fill="#34D399"/>
      <text x="520" y="279" class="tiny">Jetson</text>
      <text x="520" y="299" class="tiny">추론 서버</text>
    </g>
    <path d="M410 164 C330 296 350 646 374 952" fill="none" stroke="#10B981" stroke-width="5" opacity="0.50"/>
    <path d="M410 164 C466 186 490 220 482 270" fill="none" stroke="#10B981" stroke-width="5" opacity="0.50"/>

    <!-- movement path and person -->
    <path d="M148 302 C208 392 250 500 308 606 C356 692 390 812 374 952"
          fill="none" stroke="#6C79FF" stroke-width="18" stroke-linecap="round" stroke-dasharray="1 28" opacity="0.16" filter="url(#pathGlow)"/>
    <path d="M148 302 C208 392 250 500 308 606 C356 692 390 812 374 952"
          fill="none" stroke="#6C79FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="15 18" opacity="0.78"/>

    <g transform="translate(340 900)" filter="url(#softShadow)">
      <rect x="-66" y="-60" width="216" height="52" rx="26" fill="#FFFFFF"/>
      <text x="-24" y="-27" class="chip">서 있음 · 낙상 구역</text>
      <circle cx="40" cy="40" r="62" fill="#7C5CFF" opacity="0.16"/>
      <circle cx="40" cy="40" r="34" fill="#D1FAE5"/>
      <circle cx="40" cy="40" r="21" fill="url(#green)"/>
      <circle cx="40" cy="13" r="10" fill="#FFFFFF"/>
      <path d="M40 28v38 M24 42l16-9 17 9 M32 82l8-16 10 16"
            fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- bottom legend -->
  <g filter="url(#softShadow)">
    <rect x="162" y="1400" width="756" height="94" rx="34" fill="#FFFFFF"/>
    <circle cx="212" cy="1447" r="11" fill="#F59E0B"/>
    <text x="234" y="1454" class="small">사람 위치</text>
    <circle cx="358" cy="1447" r="11" fill="#10B981"/>
    <text x="380" y="1454" class="small">ESP32-S3 수신 노드</text>
    <line x1="592" y1="1447" x2="652" y2="1447" stroke="#6C79FF" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>
    <text x="676" y="1454" class="small">최근 이동 경로</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="185" y="1516" width="710" height="64" rx="28" fill="#F8FBFF"/>
    <text x="230" y="1557" class="small">실험 공간을 실제 치수 기준으로 10×18 타일 격자에 매핑하고, 내부만 가상 주거 구조로 구성</text>
  </g>
</svg>
