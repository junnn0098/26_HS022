<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <pattern id="tile" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#D0D6DE" stroke-width="0.8"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9BA3AF" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,5 L10,0 L10,10 Z" fill="#111827"/>
    </marker>
    <style>
      text { font-family: 'Malgun Gothic','Noto Sans KR','Arial',sans-serif; fill:#111827; }
      .thin { stroke:#111827; stroke-width:1; fill:none; }
      .mid { stroke:#111827; stroke-width:2; fill:none; }
      .wall { stroke:#111827; stroke-width:9; fill:none; stroke-linecap:square; stroke-linejoin:miter; }
      .innerWall { stroke:#111827; stroke-width:6; fill:none; stroke-linecap:square; stroke-linejoin:miter; }
      .light { stroke:#6B7280; stroke-width:1; fill:none; }
      .dim { stroke:#111827; stroke-width:1.2; fill:none; marker-start:url(#arrow); marker-end:url(#arrow); }
      .ext { stroke:#111827; stroke-width:1; fill:none; }
      .room { font-size:18px; font-weight:700; }
      .label { font-size:20px; font-weight:700; }
      .small { font-size:13px; }
      .tiny { font-size:11px; }
      .title { font-size:28px; font-weight:900; letter-spacing:8px; }
      .stamp { font-size:12px; }
      .sensor { stroke:#111827; stroke-width:2; fill:#FFFFFF; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#FFFFFF"/>
  <rect x="24" y="20" width="1552" height="1048" class="mid"/>
  <line x1="1330" y1="20" x2="1330" y2="1068" class="mid"/>

  <!-- right title block -->
  <g transform="translate(1330 20)">
    <rect x="0" y="0" width="246" height="1048" fill="#FFFFFF"/>
    <rect x="12" y="16" width="222" height="96" class="thin"/>
    <text x="24" y="42" class="stamp">PROJECT</text>
    <text x="24" y="70" class="label">HANIUM SAFETY</text>
    <text x="24" y="94" class="small">WiFi CSI Fall Detection</text>

    <rect x="12" y="132" width="222" height="96" class="thin"/>
    <text x="24" y="158" class="stamp">DRAWING</text>
    <text x="24" y="186" class="label">투룸 실험 환경 평면도</text>
    <text x="24" y="210" class="small">10×18 TILE / 4.5m×8.1m</text>

    <rect x="12" y="254" width="222" height="270" class="thin"/>
    <text x="24" y="282" class="stamp">ROOM LEGEND</text>
    <line x1="24" y1="310" x2="220" y2="310" class="light"/>
    <text x="24" y="338" class="small">01  거실</text>
    <text x="24" y="368" class="small">02  주방 / 식당</text>
    <text x="24" y="398" class="small">03  침실-1</text>
    <text x="24" y="428" class="small">04  침실-2</text>
    <text x="24" y="458" class="small">05  욕실</text>
    <text x="24" y="488" class="small">06  현관</text>
    <text x="24" y="510" class="tiny">※ 내부 구조는 실험 공간 기반 가상 배치</text>

    <rect x="12" y="548" width="222" height="214" class="thin"/>
    <text x="24" y="576" class="stamp">SENSOR / NETWORK</text>
    <line x1="24" y1="604" x2="220" y2="604" class="light"/>
    <circle cx="36" cy="638" r="9" class="sensor"/>
    <text x="56" y="643" class="small">ESP32-S3 수신 노드</text>
    <rect x="27" y="674" width="18" height="18" class="sensor"/>
    <text x="56" y="689" class="small">ipTIME AP 실제 배치</text>
    <text x="24" y="728" class="tiny">※ Jetson 서버는 분석 장비로 위치 고정 대상 아님</text>

    <rect x="12" y="792" width="222" height="136" class="thin"/>
    <text x="24" y="820" class="stamp">SCALE</text>
    <text x="24" y="854" class="small">1 TILE = 450mm × 450mm</text>
    <text x="24" y="884" class="small">TOTAL = 10 × 18 = 180 TILE</text>
    <text x="24" y="914" class="small">SCALE 1 : 80</text>

    <rect x="12" y="956" width="222" height="72" class="thin"/>
    <text x="24" y="984" class="stamp">NOTE</text>
    <text x="24" y="1010" class="tiny">실제 실험장 위에 투룸 가상 구조를 매핑</text>
  </g>

  <!-- north symbol -->
  <g transform="translate(92 92)">
    <circle cx="0" cy="0" r="30" class="thin"/>
    <line x1="0" y1="36" x2="0" y2="-48" class="mid" marker-end="url(#arrow)"/>
    <line x1="-26" y1="26" x2="26" y2="-26" class="light"/>
    <text x="-7" y="-58" class="label">N</text>
  </g>

  <!-- site outline -->
  <path d="M142 334 L430 238 L997 238 L1135 335 L1160 893 L1058 969 L316 969 L166 812 Z"
        fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
  <path d="M95 860 L214 818 L272 1005 L115 1040" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <path d="M1015 238 L1182 310 L1190 872 L1116 946" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>

  <!-- plan group: 10 tiles x 18 tiles, tile = 45px -->
  <g transform="translate(332 154)">
    <!-- dimensions -->
    <line x1="0" y1="-70" x2="450" y2="-70" class="dim"/>
    <line x1="0" y1="-45" x2="0" y2="0" class="ext"/>
    <line x1="450" y1="-45" x2="450" y2="0" class="ext"/>
    <text x="192" y="-84" class="small">4500</text>
    <text x="174" y="-108" class="small">10칸 × 450mm</text>

    <line x1="-76" y1="0" x2="-76" y2="810" class="dim"/>
    <line x1="-52" y1="0" x2="0" y2="0" class="ext"/>
    <line x1="-52" y1="810" x2="0" y2="810" class="ext"/>
    <text x="-118" y="420" class="small" transform="rotate(-90 -118 420)">8100</text>
    <text x="-146" y="456" class="small" transform="rotate(-90 -146 456)">18칸 × 450mm</text>

    <line x1="0" y1="-34" x2="225" y2="-34" class="dim"/>
    <line x1="225" y1="-34" x2="450" y2="-34" class="dim"/>
    <text x="94" y="-46" class="tiny">2250</text>
    <text x="318" y="-46" class="tiny">2250</text>

    <line x1="488" y1="0" x2="488" y2="225" class="dim"/>
    <line x1="488" y1="225" x2="488" y2="450" class="dim"/>
    <line x1="488" y1="450" x2="488" y2="810" class="dim"/>
    <text x="500" y="112" class="tiny" transform="rotate(90 500 112)">2250</text>
    <text x="500" y="335" class="tiny" transform="rotate(90 500 335)">2250</text>
    <text x="500" y="635" class="tiny" transform="rotate(90 500 635)">3600</text>

    <!-- rooms / grid -->
    <rect x="0" y="0" width="450" height="810" fill="url(#tile)"/>
    <rect x="0" y="0" width="225" height="225" fill="#F7F7F7"/>
    <rect x="225" y="0" width="225" height="225" fill="#FBFBFB"/>
    <rect x="0" y="225" width="300" height="225" fill="#F8F8F8"/>
    <rect x="300" y="225" width="150" height="225" fill="#F7F7F7"/>
    <rect x="0" y="450" width="270" height="360" fill="#F7F7F7"/>
    <rect x="270" y="450" width="180" height="180" fill="#F8F8F8"/>
    <rect x="270" y="630" width="180" height="180" fill="#FAFAFA"/>

    <!-- wall hatches -->
    <rect x="-6" y="-6" width="462" height="12" fill="url(#hatch)"/>
    <rect x="-6" y="804" width="462" height="12" fill="url(#hatch)"/>
    <rect x="-6" y="-6" width="12" height="822" fill="url(#hatch)"/>
    <rect x="444" y="-6" width="12" height="822" fill="url(#hatch)"/>

    <!-- walls -->
    <rect x="0" y="0" width="450" height="810" class="wall"/>
    <line x1="225" y1="0" x2="225" y2="225" class="innerWall"/>
    <line x1="0" y1="225" x2="450" y2="225" class="innerWall"/>
    <line x1="300" y1="225" x2="300" y2="450" class="innerWall"/>
    <line x1="0" y1="450" x2="450" y2="450" class="innerWall"/>
    <line x1="270" y1="450" x2="270" y2="810" class="innerWall"/>
    <line x1="270" y1="630" x2="450" y2="630" class="innerWall"/>

    <!-- door openings and swings -->
    <rect x="206" y="186" width="38" height="58" fill="#FFFFFF"/>
    <path d="M206 244 A58 58 0 0 1 244 190" class="light"/>
    <rect x="272" y="414" width="58" height="58" fill="#FFFFFF"/>
    <path d="M272 472 A58 58 0 0 1 330 420" class="light"/>
    <rect x="332" y="414" width="58" height="58" fill="#FFFFFF"/>
    <path d="M390 472 A58 58 0 0 0 334 420" class="light"/>
    <rect x="330" y="612" width="62" height="36" fill="#FFFFFF"/>
    <path d="M330 648 A58 58 0 0 1 388 616" class="light"/>
    <rect x="276" y="734" width="58" height="70" fill="#FFFFFF"/>
    <path d="M276 804 A70 70 0 0 1 334 742" class="light"/>

    <!-- windows -->
    <line x1="48" y1="-8" x2="180" y2="-8" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="48" y1="-16" x2="180" y2="-16" class="thin"/>
    <line x1="48" y1="-1" x2="180" y2="-1" class="thin"/>
    <line x1="270" y1="-8" x2="420" y2="-8" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="270" y1="-16" x2="420" y2="-16" class="thin"/>
    <line x1="270" y1="-1" x2="420" y2="-1" class="thin"/>
    <line x1="452" y1="282" x2="452" y2="398" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="460" y1="282" x2="460" y2="398" class="thin"/>
    <line x1="445" y1="282" x2="445" y2="398" class="thin"/>
    <line x1="50" y1="812" x2="184" y2="812" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="50" y1="820" x2="184" y2="820" class="thin"/>
    <line x1="50" y1="805" x2="184" y2="805" class="thin"/>

    <!-- furniture: room 2 -->
    <g opacity="0.9">
      <rect x="34" y="44" width="128" height="88" rx="8" class="thin"/>
      <rect x="44" y="54" width="52" height="32" rx="6" class="light"/>
      <line x1="34" y1="94" x2="162" y2="94" class="light"/>
      <rect x="172" y="44" width="28" height="128" rx="5" class="thin"/>
      <line x1="172" y1="84" x2="200" y2="84" class="light"/>
      <line x1="172" y1="124" x2="200" y2="124" class="light"/>
      <rect x="42" y="150" width="98" height="36" class="thin"/>
      <circle cx="154" cy="168" r="12" class="thin"/>

      <!-- kitchen / dining -->
      <rect x="252" y="32" width="160" height="62" class="thin"/>
      <line x1="306" y1="32" x2="306" y2="94" class="light"/>
      <rect x="264" y="48" width="34" height="24" rx="5" class="light"/>
      <circle cx="336" cy="62" r="13" class="thin"/>
      <circle cx="382" cy="62" r="13" class="thin"/>
      <rect x="282" y="124" width="96" height="58" rx="8" class="thin"/>
      <circle cx="254" cy="154" r="13" class="thin"/>
      <circle cx="406" cy="154" r="13" class="thin"/>

      <!-- living -->
      <rect x="42" y="270" width="112" height="54" rx="9" class="thin"/>
      <rect x="52" y="278" width="92" height="22" rx="5" class="light"/>
      <line x1="82" y1="278" x2="82" y2="300" class="light"/>
      <line x1="114" y1="278" x2="114" y2="300" class="light"/>
      <rect x="184" y="300" width="76" height="48" rx="8" class="thin"/>
      <circle cx="198" cy="262" r="12" class="thin"/>
      <circle cx="246" cy="262" r="12" class="thin"/>
      <rect x="36" y="396" width="180" height="28" class="thin"/>

      <!-- bathroom -->
      <rect x="326" y="274" width="46" height="118" rx="9" class="thin"/>
      <ellipse cx="349" cy="332" rx="18" ry="23" class="thin"/>
      <line x1="332" y1="284" x2="366" y2="316" class="light"/>
      <circle cx="338" cy="292" r="4" fill="#111827"/>
      <rect x="396" y="260" width="28" height="48" rx="5" class="thin"/>
      <ellipse cx="410" cy="284" rx="10" ry="14" class="light"/>
      <rect x="396" y="362" width="28" height="42" rx="5" class="thin"/>

      <!-- bedroom 1 -->
      <rect x="38" y="548" width="172" height="150" rx="10" class="thin"/>
      <rect x="50" y="560" width="62" height="44" rx="7" class="light"/>
      <rect x="132" y="560" width="62" height="44" rx="7" class="light"/>
      <line x1="38" y1="616" x2="210" y2="616" class="light"/>
      <line x1="54" y1="654" x2="194" y2="654" class="light"/>
      <rect x="224" y="492" width="32" height="196" rx="5" class="thin"/>
      <line x1="224" y1="538" x2="256" y2="538" class="light"/>
      <line x1="224" y1="584" x2="256" y2="584" class="light"/>
      <line x1="224" y1="630" x2="256" y2="630" class="light"/>

      <!-- entrance -->
      <rect x="314" y="682" width="96" height="34" class="thin"/>
      <line x1="346" y1="682" x2="346" y2="716" class="light"/>
      <line x1="378" y1="682" x2="378" y2="716" class="light"/>
      <path d="M320 750 q16 -10 32 0" class="light"/>
      <path d="M368 750 q16 -10 32 0" class="light"/>
      <rect x="390" y="754" width="38" height="34" class="thin"/>
    </g>

    <!-- labels -->
    <text x="24" y="32" class="room">침실-2</text>
    <text x="250" y="32" class="room">주방 / 식당</text>
    <text x="24" y="260" class="room">거실</text>
    <text x="326" y="260" class="room">욕실</text>
    <text x="24" y="486" class="room">침실-1</text>
    <text x="310" y="672" class="room">현관</text>

    <!-- sensors and actual router position -->
    <g>
      <circle cx="0" cy="0" r="18" class="sensor"/>
      <circle cx="450" cy="0" r="18" class="sensor"/>
      <circle cx="0" cy="810" r="18" class="sensor"/>
      <circle cx="450" cy="810" r="18" class="sensor"/>
      <text x="-46" y="-24" class="tiny">ESP1</text>
      <text x="464" y="-24" class="tiny">ESP2</text>
      <text x="-46" y="842" class="tiny">ESP3</text>
      <text x="464" y="842" class="tiny">ESP4</text>

      <rect x="286" y="704" width="28" height="28" class="sensor"/>
      <path d="M289 718 C296 708, 304 708, 311 718" class="light"/>
      <path d="M293 722 C298 716, 302 716, 307 722" class="light"/>
      <text x="291" y="724" class="tiny">AP</text>
      <text x="320" y="724" class="tiny">ipTIME AP 실제 위치</text>
    </g>

    <text x="20" y="790" class="tiny">GRID: 10 × 18 / 180 TILE</text>
    <text x="20" y="773" class="tiny">1 TILE: 450mm × 450mm</text>
  </g>

  <!-- lower title -->
  <g transform="translate(548 1038)">
    <circle cx="-48" cy="-8" r="20" class="thin"/>
    <text x="-54" y="-2" class="small">1</text>
    <line x1="-18" y1="-8" x2="276" y2="-8" class="mid"/>
    <text x="8" y="-26" class="title">투 룸 실 험 환 경 평 면 도</text>
    <text x="106" y="20" class="small">SCALE 1 / 80</text>
  </g>
</svg>
