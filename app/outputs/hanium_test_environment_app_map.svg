<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FAFF"/>
    </linearGradient>
    <linearGradient id="greenRoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF7EF"/>
      <stop offset="100%" stop-color="#DDEEE5"/>
    </linearGradient>
    <linearGradient id="yellowRoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4CB"/>
      <stop offset="100%" stop-color="#F4D98E"/>
    </linearGradient>
    <linearGradient id="blueRoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F1FF"/>
      <stop offset="100%" stop-color="#D4E4FA"/>
    </linearGradient>
    <linearGradient id="purpleRoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1DDF7"/>
      <stop offset="100%" stop-color="#E3C7ED"/>
    </linearGradient>
    <linearGradient id="cyanRoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5F8FB"/>
      <stop offset="100%" stop-color="#CFEAF1"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#17213B" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17213B" flood-opacity="0.12"/>
    </filter>
    <filter id="pathGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="floorGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.16"/>
    </pattern>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; }
      .room { font-size: 20px; font-weight: 900; fill: #172033; letter-spacing: -0.4px; }
      .chip { font-size: 17px; font-weight: 900; fill: #10B981; }
      .small { font-size: 13px; font-weight: 850; fill: #667085; }
      .mini { font-size: 12px; font-weight: 850; fill: #6B7280; }
    </style>
  </defs>

  <rect x="24" y="24" width="852" height="852" rx="54" fill="url(#cardBg)" stroke="#E7ECF4" stroke-width="3"/>

  <g filter="url(#soft)">
    <rect x="76" y="70" width="282" height="54" rx="27" fill="#F0FFF7"/>
    <path d="M105 97l11 11 23-27" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="104" class="chip">실제 테스트 환경</text>
  </g>

  <g filter="url(#soft)">
    <rect x="680" y="70" width="142" height="54" rx="27" fill="#FFFFFF"/>
    <circle cx="714" cy="97" r="10" fill="#10B981"/>
    <text x="735" y="104" class="chip">거실</text>
  </g>

  <g transform="translate(450 470) rotate(45) scale(1 0.72) translate(-450 -470)" filter="url(#shadow)">
    <rect x="178" y="188" width="544" height="544" rx="22" fill="#FFFFFF" stroke="#263447" stroke-width="10"/>
    <rect x="178" y="188" width="544" height="544" rx="22" fill="url(#floorGrid)"/>

    <rect x="178" y="188" width="314" height="300" fill="url(#greenRoom)" stroke="#263447" stroke-width="7"/>
    <rect x="492" y="188" width="230" height="214" fill="url(#yellowRoom)" stroke="#263447" stroke-width="7"/>
    <rect x="178" y="488" width="214" height="244" fill="url(#blueRoom)" stroke="#263447" stroke-width="7"/>
    <rect x="392" y="488" width="132" height="244" fill="url(#cyanRoom)" stroke="#263447" stroke-width="7"/>
    <rect x="524" y="402" width="198" height="330" fill="url(#purpleRoom)" stroke="#263447" stroke-width="7"/>
    <rect x="492" y="402" width="32" height="86" fill="#FFFFFF" stroke="#263447" stroke-width="7"/>

    <rect x="230" y="248" width="116" height="56" rx="17" fill="#AFC4B8" opacity="0.95"/>
    <rect x="324" y="362" width="112" height="72" rx="17" fill="#D7BD72" opacity="0.95"/>
    <circle cx="357" cy="398" r="17" fill="#FFF8D8"/>
    <circle cx="397" cy="398" r="17" fill="#FFF8D8"/>

    <rect x="548" y="244" width="92" height="88" rx="18" fill="#CBB474" opacity="0.9"/>
    <rect x="642" y="326" width="78" height="60" rx="18" fill="#CBB474" opacity="0.9"/>
    <circle cx="666" cy="356" r="16" fill="#FFF8D8"/>
    <circle cx="700" cy="356" r="16" fill="#FFF8D8"/>

    <rect x="224" y="578" width="132" height="104" rx="20" fill="#AFC4E7" opacity="0.95"/>
    <line x1="248" y1="632" x2="333" y2="632" stroke="#F8FBFF" stroke-width="5" opacity="0.95"/>
    <rect x="426" y="560" width="52" height="126" rx="19" fill="#94CAD4" opacity="0.95"/>
    <circle cx="452" cy="622" r="18" fill="#F8FBFF" opacity="0.95"/>
    <rect x="600" y="552" width="64" height="142" rx="19" fill="#B58AC5" opacity="0.9"/>
  </g>

  <text x="235" y="254" class="room">거실/보행</text>
  <text x="620" y="458" class="room">장비 테이블</text>
  <text x="196" y="593" class="room">이동 구역</text>
  <text x="409" y="605" class="room">욕실</text>
  <text x="585" y="505" class="room">낙상 구역</text>

  <path d="M310 338 C340 424 395 507 468 571 S592 649 640 720"
        fill="none" stroke="#6C79FF" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="1 26" opacity="0.18" filter="url(#pathGlow)"/>
  <path d="M310 338 C340 424 395 507 468 571 S592 649 640 720"
        fill="none" stroke="#6C79FF" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="15 17" opacity="0.74"/>

  <g filter="url(#soft)">
    <rect x="514" y="584" width="226" height="50" rx="25" fill="#FFFFFF"/>
    <text x="552" y="616" class="chip">서 있음 · 낙상 구역</text>
  </g>

  <g transform="translate(612 633)" filter="url(#soft)">
    <circle cx="34" cy="34" r="54" fill="#7C5CFF" opacity="0.16"/>
    <circle cx="34" cy="34" r="32" fill="#D1FAE5"/>
    <circle cx="34" cy="34" r="20" fill="url(#person)"/>
    <circle cx="34" cy="8" r="9" fill="#FFFFFF"/>
    <path d="M34 22v35 M20 35l14-8 15 8 M27 70l7-13 9 13"
          fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="452" cy="142" r="30" fill="#D1FAE5"/>
    <circle cx="452" cy="142" r="18" fill="#10B981"/>
    <circle cx="452" cy="142" r="8" fill="#FFFFFF"/>
    <circle cx="138" cy="383" r="30" fill="#D1FAE5"/>
    <circle cx="138" cy="383" r="18" fill="#10B981"/>
    <circle cx="138" cy="383" r="8" fill="#FFFFFF"/>
    <circle cx="450" cy="777" r="30" fill="#D1FAE5"/>
    <circle cx="450" cy="777" r="18" fill="#10B981"/>
    <circle cx="450" cy="777" r="8" fill="#FFFFFF"/>
    <circle cx="760" cy="388" r="30" fill="#D1FAE5"/>
    <circle cx="760" cy="388" r="18" fill="#10B981"/>
    <circle cx="760" cy="388" r="8" fill="#FFFFFF"/>
  </g>

  <g filter="url(#soft)">
    <rect x="486" y="250" width="150" height="64" rx="24" fill="#FFFFFF"/>
    <circle cx="516" cy="282" r="18" fill="#EEF2FF"/>
    <path d="M507 287l17-16 17 16" fill="none" stroke="#5966F3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550" y="276" class="mini">ipTIME AP</text>
    <text x="550" y="296" class="mini">송신</text>
  </g>

  <g filter="url(#soft)">
    <rect x="642" y="360" width="158" height="64" rx="24" fill="#FFFFFF"/>
    <rect x="666" y="378" width="38" height="32" rx="9" fill="#111827"/>
    <rect x="673" y="386" width="24" height="7" rx="4" fill="#34D399"/>
    <text x="716" y="387" class="mini">Jetson</text>
    <text x="716" y="407" class="mini">서버</text>
  </g>

  <path d="M516 282 C488 344 522 487 640 720" fill="none" stroke="#10B981" stroke-width="5" opacity="0.54"/>
  <path d="M516 282 C570 300 637 332 682 378" fill="none" stroke="#10B981" stroke-width="5" opacity="0.54"/>

  <g filter="url(#soft)">
    <rect x="236" y="804" width="428" height="54" rx="27" fill="#FFFFFF"/>
    <circle cx="278" cy="831" r="8" fill="#F59E0B"/>
    <text x="294" y="837" class="small">사람</text>
    <circle cx="374" cy="831" r="8" fill="#10B981"/>
    <text x="390" y="837" class="small">확인 구역</text>
    <line x1="508" y1="831" x2="556" y2="831" stroke="#6C79FF" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
    <text x="578" y="837" class="small">최근 이동</text>
  </g>
</svg>
