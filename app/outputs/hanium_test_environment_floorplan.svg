      <circle r="31" fill="#D1FAE5"/>
      <circle r="19" fill="url(#device)"/>
      <circle r="9" fill="#FFFFFF"/>
    </g>
    <g transform="translate(199 459)" filter="url(#softShadow)">
      <circle r="31" fill="#D1FAE5"/>
      <circle r="19" fill="url(#device)"/>
      <circle r="9" fill="#FFFFFF"/>
    </g>
    <g transform="translate(533 924)" filter="url(#softShadow)">
      <circle r="31" fill="#D1FAE5"/>
      <circle r="19" fill="url(#device)"/>
      <circle r="9" fill="#FFFFFF"/>
    </g>
    <g transform="translate(881 466)" filter="url(#softShadow)">
      <circle r="31" fill="#D1FAE5"/>
      <circle r="19" fill="url(#device)"/>
      <circle r="9" fill="#FFFFFF"/>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="122" y="846" width="336" height="88" rx="30" fill="#FFFFFF"/>
    <circle cx="158" cy="890" r="10" fill="#F59E0B"/>
    <text x="176" y="896" class="small">사람 위치</text>
    <circle cx="272" cy="890" r="10" fill="#10B981"/>
    <text x="290" y="896" class="small">ESP32 노드</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="482" y="846" width="252" height="88" rx="30" fill="#FFFFFF"/>
    <line x1="520" y1="890" x2="590" y2="890" stroke="#6C79FF" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/>
    <text x="612" y="896" class="small">최근 이동</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="760" y="846" width="198" height="88" rx="30" fill="#FFFFFF"/>
    <circle cx="798" cy="890" r="10" fill="#111827"/>
    <text x="816" y="896" class="small">Jetson/서버</text>
  </g>
</svg>
