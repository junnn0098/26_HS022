<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#EEF3FB"/>
    </linearGradient>
    <linearGradient id="living" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7F4EC"/>
      <stop offset="100%" stop-color="#D7EADF"/>
    </linearGradient>
    <linearGradient id="fallZone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDECEF"/>
      <stop offset="100%" stop-color="#FAD4DC"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FF"/>
      <stop offset="100%" stop-color="#D6E6FC"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2CB"/>
      <stop offset="100%" stop-color="#F3D893"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E7BFF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#17213B" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17213B" flood-opacity="0.14"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B8C5D6" stroke-width="1" opacity="0.18"/>
    </pattern>
    <style>
      .title { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; font-size: 34px; font-weight: 900; fill: #111827; letter-spacing: -1px; }
      .sub { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; font-size: 18px; font-weight: 750; fill: #7A8397; }
      .label { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; font-size: 24px; font-weight: 900; fill: #1D2738; }
      .small { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; font-size: 16px; font-weight: 800; fill: #536176; }
      .chip { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; font-size: 18px; font-weight: 900; fill: #10B981; }
      .tiny { font-family: 'Pretendard','Noto Sans KR','Segoe UI',sans-serif; font-size: 14px; font-weight: 800; fill: #6B7280; }
    </style>
  </defs>

  <rect width="1080" height="1080" rx="64" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="86" y="74" width="908" height="932" rx="54" fill="#FFFFFF"/>
    <rect x="86" y="74" width="908" height="932" rx="54" fill="none" stroke="#E5ECF5" stroke-width="3"/>
  </g>

  <text x="126" y="130" class="title">WiFi CSI 테스트 실제 환경 도면</text>
  <text x="126" y="165" class="sub">공유기 1대 · ESP32-S3 수신 노드 4대 · Jetson Orin · 보호자 앱 연동</text>

  <g transform="translate(540 574) rotate(45) scale(1 0.72) translate(-540 -574)" filter="url(#softShadow)">
    <rect x="222" y="256" width="636" height="636" rx="22" fill="#FFFFFF" stroke="#334155" stroke-width="11"/>
    <rect x="222" y="256" width="636" height="636" rx="22" fill="url(#grid)" opacity="0.95"/>

    <rect x="222" y="256" width="356" height="356" fill="url(#living)" stroke="#334155" stroke-width="7"/>
    <rect x="578" y="256" width="280" height="226" fill="url(#desk)" stroke="#334155" stroke-width="7"/>
    <rect x="222" y="612" width="232" height="280" fill="url(#hall)" stroke="#334155" stroke-width="7"/>
    <rect x="454" y="612" width="154" height="280" fill="#DDF4F8" stroke="#334155" stroke-width="7"/>
    <rect x="608" y="482" width="250" height="410" fill="#EAD6F1" stroke="#334155" stroke-width="7"/>
    <rect x="578" y="482" width="30" height="130" fill="#FFFFFF" stroke="#334155" stroke-width="7"/>

    <rect x="284" y="324" width="132" height="58" rx="18" fill="#ABC0B3" opacity="0.9"/>
    <rect x="363" y="475" width="118" height="74" rx="16" fill="#D8BF79" opacity="0.9"/>
    <circle cx="397" cy="512" r="18" fill="#FFF8D9"/>
    <circle cx="438" cy="512" r="18" fill="#FFF8D9"/>

    <rect x="632" y="318" width="96" height="92" rx="18" fill="#CBB474" opacity="0.85"/>
    <rect x="746" y="390" width="86" height="62" rx="18" fill="#CBB474" opacity="0.85"/>
    <circle cx="770" cy="421" r="17" fill="#FFF8D9"/>
    <circle cx="809" cy="421" r="17" fill="#FFF8D9"/>

    <rect x="270" y="705" width="150" height="108" rx="20" fill="#AFC4E7" opacity="0.92"/>
    <line x1="292" y1="760" x2="398" y2="760" stroke="#F8FBFF" stroke-width="5" opacity="0.9"/>
    <rect x="493" y="688" width="58" height="138" rx="20" fill="#9CCDD7" opacity="0.95"/>
    <circle cx="522" cy="750" r="20" fill="#F8FBFF" opacity="0.95"/>
    <rect x="684" y="665" width="76" height="152" rx="20" fill="#B892C8" opacity="0.86"/>
  </g>

  <g transform="translate(540 574) rotate(45) scale(1 0.72) translate(-540 -574)">
    <text x="254" y="310" class="label" transform="rotate(-45 254 310) scale(1 1.39)">생활/보행 구역</text>
    <text x="638" y="300" class="label" transform="rotate(-45 638 300) scale(1 1.39)">장비 테이블</text>
    <text x="263" y="670" class="label" transform="rotate(-45 263 670) scale(1 1.39)">이동 구역</text>
    <text x="470" y="666" class="label" transform="rotate(-45 470 666) scale(1 1.39)">욕실</text>
    <text x="640" y="535" class="label" transform="rotate(-45 640 535) scale(1 1.39)">낙상 실험 구역</text>
  </g>

  <path d="M362 393 C394 454, 436 515, 510 568 S656 641, 699 724"
        fill="none" stroke="url(#path)" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="1 24" opacity="0.65"/>
  <path d="M362 393 C394 454, 436 515, 510 568 S656 641, 699 724"
        fill="none" stroke="#6C79FF" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="16 20" opacity="0.78"/>

  <g filter="url(#glow)" opacity="0.42">
    <circle cx="699" cy="724" r="86" fill="#7C5CFF"/>
  </g>

  <g transform="translate(681 665)" filter="url(#softShadow)">
    <circle cx="36" cy="36" r="34" fill="#34D399" opacity="0.2"/>
    <circle cx="36" cy="36" r="20" fill="#10B981"/>
    <circle cx="36" cy="11" r="10" fill="#FFFFFF"/>
    <path d="M36 24 L36 54 M21 38 L36 31 L51 38 M28 66 L36 54 L45 66"
          stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="612" y="628" width="188" height="54" rx="27" fill="#FFFFFF"/>
    <text x="642" y="663" class="chip">현재 위치 · 낙상 구역</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="564" y="338" width="156" height="74" rx="26" fill="#FFFFFF"/>
    <circle cx="604" cy="375" r="20" fill="#EEF2FF"/>
    <path d="M595 380 L613 366 L632 382" fill="none" stroke="#5966F3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="644" y="366" class="tiny">ipTIME AP</text>
    <text x="644" y="387" class="tiny">WiFi 송신</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="700" y="442" width="168" height="78" rx="26" fill="#FFFFFF"/>
    <rect x="724" y="462" width="40" height="38" rx="10" fill="#111827"/>
    <rect x="731" y="469" width="26" height="8" rx="4" fill="#34D399"/>
    <text x="778" y="471" class="tiny">Jetson Orin</text>
    <text x="778" y="493" class="tiny">추론/중계</text>
  </g>

  <g fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M604 375 C540 400, 482 425, 430 480"/>
    <path d="M604 375 C665 396, 706 427, 742 462"/>
    <path d="M604 375 C550 500, 584 611, 699 724"/>
  </g>

  <g>
